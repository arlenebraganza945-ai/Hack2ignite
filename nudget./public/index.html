<!DOCTYPE html>
<html lang="en">
<head>
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudget</title>
       <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
    <!-- LOGIN SCREEN -->
    <div id="auth-section">
        <h1>Nudget</h1>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="login-btn">Login</button>
        <button id="signup-btn">Sign Up</button>
        <p id="auth-message" style="color: red;"></p>
    </div>

    <!-- DASHBOARD -->
    <!-- DASHBOARD -->
     <!-- Live Checkout Simulator -->

<div id="dashboard-section" style="display: none;">
    <h2>Welcome back!</h2>
    <button type="button" id="open-mock-btn" style="background:#ff7675;">⚡ Test Live Checkout</button>

<!-- Payment Modal (Hidden by default) -->
<div id="payment-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;">
    <div style="background:white; padding:24px; border-radius:12px; width:300px; text-align:center;">
        <p style="color:#888; margin:0;">Mock Bank Gateway</p>
        <h3 style="margin:8px 0;">Paying ₹240 to Cafe</h3>
        
        <p style="font-size:13px; margin-bottom:8px;">Categorize before payment:</p>
        <select id="mock-category">
            <option value="Food">Food & Snacks</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Fun / Outings</option>
        </select>
        
        <button id="confirm-pay-btn" style="background:#00b894; margin-top:12px;">Authorize & Pay ₹240</button>
        <button id="cancel-pay-btn" style="background:#d63031;">Cancel</button>
    </div>
    
    <hr>

    <h3>Quick Add Expense</h3>
    <form id="expense-form">
        <input type="number" id="amount" placeholder="Amount (e.g. 150)" required>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Uncategorized">Note/Uncategorized</option>
        </select>
        <input type="text" id="note" placeholder="What was it for? (Optional)">
        
        <button type="submit">Add Expense</button>
    </form>
    <p id="expense-message" style="color: green; font-weight: bold;"></p>
    <hr>
        <h3>Your Recent Expenses</h3>
        <ul id="expense-list">
            <!-- Expenses will magically appear here -->
        </ul>
</div>
<div class="container"></div>
    <script src="app.js"></script>
</body>
</html>
